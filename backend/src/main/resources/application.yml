spring:
  application:
    name: chamati-backend

  # Carrega o .env da raiz do projeto (o backend roda a partir de backend/).
  # Opcional: em produção as variáveis vêm do ambiente do servidor/container.
  config:
    import: optional:file:../.env[.properties]

  # Conexão: todas as credenciais vêm de variáveis de ambiente.
  # Sem valor padrão de propósito: se faltar variável, a aplicação não sobe.
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 20000

  # Anexos: até 5 MB por arquivo (o limite do service é o mesmo).
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  # Hibernate apenas valida: o esquema pertence ao Flyway.
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

  # Flyway executa V1 e V2 (e V100 só no perfil dev).
  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    out-of-order: false
    clean-disabled: true        # nunca apagar o banco por engano

# JWT de acesso (HS256). O segredo vem do ambiente e não tem padrão: a aplicação não sobe sem ele
# nem com menos de 32 bytes. Gere com: openssl rand -base64 48
app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: chamati
      access-ttl: PT15M     # vida curta do access token
      refresh-ttl: P7D      # sessão máxima sem novo login
  # Origens do frontend autorizadas a chamar a API (CORS), separadas por vírgula.
  # Vazio = nenhuma origem externa. Ex.: CORS_ALLOWED_ORIGINS=https://chamati.exemplo.com.br
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  # Primeiro ADMIN: criado na subida apenas se não houver administrador ativo e se e-mail e senha estiverem definidos.
  # Use uma senha provisória e troque-a no primeiro acesso; remova as variáveis depois.
  admin-inicial:
    nome: ${ADMIN_INICIAL_NOME:Administrador}
    email: ${ADMIN_INICIAL_EMAIL:}
    senha: ${ADMIN_INICIAL_SENHA:}

# Documentação OpenAPI (springdoc): JSON em /v3/api-docs e interface em /swagger-ui.html.
# Desabilitada no perfil prod (application-prod.yml).
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    persist-authorization: true
    operations-sorter: method
    tags-sorter: alpha
  default-produces-media-type: application/json
